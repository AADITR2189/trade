name: Check data sources

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "NSE symbols to test, separated by spaces"
        default: "CYIENT TECHM RELIANCE"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check news, filings, results calendar and FII/DII
        run: python -m india_trader.news ${{ inputs.symbols }}
      - name: Check India VIX
        run: python -c "from india_trader.data_sources import fetch_daily; d=fetch_daily('^INDIAVIX', range_='1mo'); print(d.tail(3) if d is not None else 'VIX unavailable')"
