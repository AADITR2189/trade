name: Telegram bot

on:
  schedule:
    # Online through market hours (India time = UTC + 5:30), checking prices every minute:
    - cron: "35 3 * * 1-5"    # 9:05 AM -> stays until 12:20 PM
    - cron: "45 6 * * 1-5"    # 12:15 PM -> stays until 3:45 PM (sends the closing summary)
    # Outside market hours: answer commands every 30 minutes (5:30 AM - 11:30 PM).
    - cron: "0,30 0-3,10-17 * * *"
    - cron: "0,30 4-9 * * 0,6"
  workflow_dispatch:
    inputs:
      until:
        description: "Stay online until this India time (HH:MM). Empty = answer once and stop."
        default: ""

permissions:
  contents: write

concurrency:
  group: trade-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Run the bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          git config user.name "trade-helper-bot"
          git config user.email "trade-helper-bot@users.noreply.github.com"
          case "${{ github.event.schedule }}" in
            "35 3 * * 1-5") UNTIL="12:20" ;;
            "45 6 * * 1-5") UNTIL="15:45" ;;
            *) UNTIL="${{ inputs.until }}" ;;
          esac
          if [ -n "$UNTIL" ]; then
            python -m india_trader.bot --until "$UNTIL"
          else
            python -m india_trader.bot --once
          fi
